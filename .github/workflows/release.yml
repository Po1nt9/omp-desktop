# Build & publish desktop installers:
#   macOS ARM / Intel (.dmg)
#   Windows x64 NSIS setup + portable zip (绿色版)
#   Linux x64 AppImage / .deb / .rpm (Ubuntu/Debian + Fedora/RHEL family)
# Trigger: push tag v*  (e.g. v0.1.1)  or manual workflow_dispatch.
#
# Prerequisites (repo Settings → Actions → General → Workflow permissions):
#   - Read and write permissions (so the job can create/update Releases)
#
# Optional signing secrets (unsigned builds still work; macOS may warn):
#   - Apple: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#            APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID  (see Tauri macOS signing docs)
# Auto-update (optional — without these, installers still publish; in-app
# update stays on the GitHub "open release page" path):
#   - OMP_DESKTOP_UPDATER_PUBLIC_KEY          minisign public key (embedded in app)
#   - TAURI_SIGNING_PRIVATE_KEY        minisign private key (sign archives)
#   - TAURI_SIGNING_PRIVATE_KEY_PASSWORD  (empty string OK)
# See docs/desktop-auto-update.md
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild (e.g. v0.1.0). Leave empty to use package version draft."
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            name: macOS-ARM64
            omp_target: darwin-arm64
            omp_artifact: omp-darwin-arm64
            sidecar_name: omp-aarch64-apple-darwin
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            name: macOS-x64
            omp_target: darwin-x64
            omp_artifact: omp-darwin-x64
            sidecar_name: omp-x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            name: Windows-x64
            omp_target: win32-x64
            omp_artifact: omp-win32-x64.exe
            sidecar_name: omp-x86_64-pc-windows-msvc.exe
          - platform: ubuntu-22.04
            args: ""
            name: Linux-x64
            omp_target: linux-x64
            omp_artifact: omp-linux-x64
            sidecar_name: omp-x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}
    name: Build ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux system deps (WebKit / GTK / RPM)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          # Use Ayatana only — libappindicator3-dev conflicts with libayatana-appindicator3-dev.
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            rpm \
            file

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: ${{ matrix.name }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # bundle-omp: compile the pinned submodule Runtime for this target.
      # build-binary.ts shells out to sibling workspace packages, so install
      # and build run from the submodule workspace root.
      - name: Build omp binary (submodule)
        working-directory: runtime/oh-my-pi
        env:
          CROSS_TARGET: ${{ matrix.omp_target }}
        run: |
          bun install --frozen-lockfile
          bun --cwd packages/coding-agent run build

      - name: Place omp binary at sidecar path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          cp "runtime/oh-my-pi/packages/coding-agent/dist/${{ matrix.omp_artifact }}" \
             "src-tauri/binaries/${{ matrix.sidecar_name }}"
          "src-tauri/binaries/${{ matrix.sidecar_name }}" --version

      # Release description = CHANGELOG.md section for this version (bilingual body).
      # Fails the job if `## [X.Y.Z]` is missing — write changelog before tagging.
      - name: Prepare release notes from CHANGELOG
        id: changelog
        shell: bash
        env:
          # Windows runners default to cp1252; bilingual CHANGELOG needs UTF-8 stdout.
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VER="${{ github.ref_name }}"
          else
            VER="v$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          fi
          python3 scripts/changelog-for-release.py "$VER" | tee release-notes.md
          # Multiline body for tauri-action `releaseBody` (no releaseBodyFile input).
          {
            echo "RELEASE_BODY<<OMP_DESKTOP_EOF"
            cat release-notes.md
            echo "OMP_DESKTOP_EOF"
          } >> "$GITHUB_ENV"

      # Detect updater secrets without failing unsigned community builds.
      - name: Detect updater secrets
        id: updater
        shell: bash
        env:
          OMP_DESKTOP_UPDATER_PUBLIC_KEY: ${{ secrets.OMP_DESKTOP_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${OMP_DESKTOP_UPDATER_PUBLIC_KEY:-}" && -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Updater secrets present — enabling in-app auto-update artifacts"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Updater secrets missing — building without createUpdaterArtifacts"
          fi

      # AC-10.9: channel identity comes from the tag/version suffix.
      - name: Derive update channel + endpoint
        id: updchan
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VER="${{ github.ref_name }}"
          else
            VER="v$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "channel=$(node scripts/update-channel-lib.mjs channel "$VER")" >> "$GITHUB_OUTPUT"
          echo "endpoint=$(node scripts/update-channel-lib.mjs endpoint "$GITHUB_REPOSITORY" "$VER")" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(node scripts/update-channel-lib.mjs prerelease "$VER")" >> "$GITHUB_OUTPUT"

      - name: Write release config (updater)
        if: steps.updater.outputs.enabled == 'true'
        shell: bash
        env:
          OMP_DESKTOP_UPDATER_PUBLIC_KEY: ${{ secrets.OMP_DESKTOP_UPDATER_PUBLIC_KEY }}
          OMP_DESKTOP_UPDATER_ENDPOINT: ${{ steps.updchan.outputs.endpoint }}
          OMP_DESKTOP_RELEASE_VERSION: ${{ steps.updchan.outputs.version }}
        run: node scripts/build-release-config.mjs

      # NOTE: Do NOT pass empty APPLE_* secrets.
      # Empty APPLE_CERTIFICATE makes `tauri build` try codesign import and fail with:
      #   "failed to import keychain certificate"
      # TAURI_SIGNING_* are only set when updater is enabled (non-empty).
      - name: Build Tauri app & attach to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OMP_DESKTOP_UPDATER_PUBLIC_KEY: ${{ secrets.OMP_DESKTOP_UPDATER_PUBLIC_KEY }}
          OMP_DESKTOP_UPDATER_ENDPOINT: ${{ steps.updchan.outputs.endpoint }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Root package.json + src-tauri/ layout (create-tauri-app style)
          projectPath: .
          # Prefer the pushed git tag; fallback replaces __VERSION__ from tauri.conf.json
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "OMP Desktop v__VERSION__"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: ${{ steps.updchan.outputs.prerelease }}
          # --config injects pubkey/endpoint + createUpdaterArtifacts.
          # OMP_DESKTOP_UPDATER_* env (above) enables build.rs registration cfg.
          args: ${{ matrix.args }}${{ steps.updater.outputs.enabled == 'true' && ' --config src-tauri/tauri.release.conf.json' || '' }}
          # We assemble a multi-platform latest.json in assemble-updater-manifest.
          includeUpdaterJson: false

      # 绿色版：免安装 zip（单文件 exe + 说明）。WebView2 仍由系统提供。
      - name: Windows portable zip (绿色版)
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          fi
          bash scripts/package-windows-portable.sh "$TAG"

  # After all platform builds: merge .sig + archives into rolling latest.json.
  # Skips cleanly when updater secrets were never used (no .sig on the release).
  assemble-updater:
    needs: publish
    runs-on: ubuntu-22.04
    name: Assemble updater latest.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble rolling omp-desktop-latest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OMP_DESKTOP_UPDATER_PUBLIC_KEY: ${{ secrets.OMP_DESKTOP_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${OMP_DESKTOP_UPDATER_PUBLIC_KEY:-}" || -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "Updater secrets not configured — skip assemble-updater-manifest"
            exit 0
          fi
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          fi
          CHANNEL="$(node scripts/update-channel-lib.mjs channel "$TAG")"
          echo "Update channel: $CHANNEL (tag $TAG)"
          # DUAL_PUBLISH_LEGACY_LATEST: transitional nightly → omp-desktop-latest
          # dual-publish (AC-10.9 D5). Delete after the first stable release.
          # Fail soft if this tag has no updater archives (partial rebuild).
          if ! TAG="$TAG" REPO="$GITHUB_REPOSITORY" CHANNEL="$CHANNEL" DUAL_PUBLISH_LEGACY_LATEST=1 bash scripts/assemble-updater-manifest.sh; then
            echo "::warning::assemble-updater-manifest failed — release installers are still published"
            exit 0
          fi

  # Supply-chain floor (NEW-06): one SHA256SUMS over every published asset so
  # users can verify downloads. Runs after all platform builds have uploaded.
  checksums:
    needs: [publish, assemble-updater]
    runs-on: ubuntu-22.04
    name: Publish SHA256SUMS
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute and upload SHA256SUMS
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          fi
          mkdir -p /tmp/release-assets
          cd /tmp/release-assets
          # Download everything except a stale checksum file from a rebuild.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*' || true
          rm -f SHA256SUMS
          shopt -s nullglob
          files=(*)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "error: no release assets found for $TAG" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber